name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        rid: [win-x64, linux-x64]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Publish
        run: dotnet publish Ermine/Ermine.csproj -r ${{ matrix.rid }} -c Release --self-contained -o out/${{ matrix.rid }}

      - name: Zip artifacts
        run: zip -r ermine-${{ matrix.rid }}.zip out/${{ matrix.rid }}

      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          files: ermine-${{ matrix.rid }}.zip