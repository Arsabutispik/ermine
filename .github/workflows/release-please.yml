name: Release Please

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          release-type: simple

  build:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - rid: win-x64
            os: windows-latest
          - rid: linux-x64
            os: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Publish Portable Binaries
        run: dotnet publish Ermine.csproj -r ${{ matrix.rid }} -c Release --self-contained -o out/${{ matrix.rid }}

      - name: Build Windows Installer
        if: matrix.rid == 'win-x64'
        shell: bash
        run: |
          TAG_NAME="${{ needs.release-please.outputs.tag_name }}"
          VERSION="${TAG_NAME#v}"
          iscc //DAppVersion="$VERSION" Ermine.iss

      - name: Build Linux AppImage
        if: matrix.rid == 'linux-x64'
        shell: bash
        run: |
          dotnet tool install --global dotnet-appimage
          dotnet appimage -r linux-x64 -c Release
          
          # The tool buries the AppImage in the bin/Release/net10.0/linux-x64/ folder.
          # This creates a clean output folder and moves the AppImage there for easier uploading.
          mkdir -p appimage-out
          find . -name "*.AppImage" -exec mv {} appimage-out/Ermine-Linux-x86_64.AppImage \;

      - name: Zip portable artifacts
        shell: bash
        run: |
          cd out/${{ matrix.rid }}
          zip -r ../../ermine-${{ matrix.rid }}-portable.zip ./*
          cd ../..

      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.release-please.outputs.tag_name }}
          files: |
            ermine-${{ matrix.rid }}-portable.zip
            installer-out/*.exe
            appimage-out/*.AppImage